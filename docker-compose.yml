name: ${COMPOSE_PROJECT_NAME:-hackalem}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: ${COMPOSE_PROJECT_NAME:-hackalem}-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Кэш прогнозов погоды и история турбин. Запасной источник погоды читает
      # их прямо из образа, когда сервис погоды недоступен.
      DATA_DIR: /data
    volumes:
      # Только на чтение: данные организаторов мы не меняем.
      - ./data:/data:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ML-сервис прогноза: принимает погоду на момент T, отдает P10/P50/P90.
  # Контракт: ml/openapi.json, Swagger: http://localhost:${ML_PORT}/docs.
  # env_file не подключаем намеренно: секреты из .env сервису не нужны.
  ml:
    build: ./ml
    image: ${COMPOSE_PROJECT_NAME:-hackalem}-ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8010}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
