name: ${COMPOSE_PROJECT_NAME:-hackalem}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: ${COMPOSE_PROJECT_NAME:-hackalem}-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Офлайн-пайплайн прогноза выработки. Тот же образ, что и backend, но без БД,
  # без портов и без рестарта: это разовая команда, а не сервис.
  # Профиль pipeline не дает ему подняться вместе со стеком по `docker compose up`.
  # Запуск: docker compose run --rm pipeline <команда>, обертка — `make pipeline`.
  pipeline:
    build: ./backend
    image: ${COMPOSE_PROJECT_NAME:-hackalem}-backend
    profiles: ["pipeline"]
    env_file: .env
    environment:
      # Пути внутри контейнера. Заданы явно, потому что в образе лежит только
      # backend/, и вычислить корень репозитория оттуда нельзя.
      DATA_DIR: /data
      OUTPUT_DIR: /outputs
      REPORTS_DIR: /reports
    volumes:
      # Исходные данные только на чтение: пайплайн их не меняет.
      - ./data:/data:ro
      - ./outputs:/outputs
      - ./reports:/reports
    entrypoint: ["python", "-m", "src.forecast.cli"]

volumes:
  pgdata:
