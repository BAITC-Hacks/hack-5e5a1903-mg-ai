[project]
name = "hackalem-backend"
version = "0.1.0"
description = "HackAlem AI backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.129.0",
    "greenlet>=3.3.1",
    "gunicorn>=25.1.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.11.0",
    "python-json-logger>=4.0.0",
    "python-multipart>=0.0.22",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
