# Одна точка входа для судьи: интерфейс и API на одном адресе.
# Благодаря этому фронтенду не нужен CORS, а порт backend не участвует в ссылках.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Адрес backend разрешается на каждом запросе, а не один раз при старте.
    # Docker выдает контейнеру новый IP при пересоздании, и nginx с закэшированным
    # адресом начинает стучаться в соседний сервис: интерфейс молча получает 404,
    # хотя backend жив. Имя в переменной заставляет nginx спрашивать DNS заново.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Приложение живет с root_path="/api", поэтому префикс сохраняется как есть.
    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Датасет пользователя это несколько мегабайт, стандартного лимита не хватает.
        client_max_body_size 64m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
