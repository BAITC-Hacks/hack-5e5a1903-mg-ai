# CI проекта ZHEL.ai из zhel-ai/. Решение OrgDiff проверяет свой workflow orgdiff.yml.
# Фильтра paths нет намеренно: "Lint and tests" и "Docker build" — обязательные проверки
# main в zhel-ai/scripts/protect-main.sh, и PR без них не смерджится.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhel-ai/backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  ml:
    name: ML service lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhel-ai/ml
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhel-ai
    steps:
      - uses: actions/checkout@v4

      # .env нужен, потому что compose объявляет env_file. Заодно это проверяет,
      # что .env.example не отстал от docker-compose.yml.
      - name: Prepare env
        run: cp .env.example .env

      - name: Build images
        run: docker compose build
