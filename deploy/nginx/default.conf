# Одна точка входа для судьи: интерфейс и API на одном адресе.
# Благодаря этому фронтенду не нужен CORS, а порт backend не участвует в ссылках.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Приложение живет с root_path="/api", поэтому префикс сохраняется как есть.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
